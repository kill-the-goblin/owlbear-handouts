<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Showing to Players</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; color: #f0f0f0; }
      body { display: flex; flex-direction: column; box-sizing: border-box; padding: 10px; gap: 8px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 400; }
      #title { color: #bcbcbc; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      #title strong { color: #f0f0f0; font-weight: 700; }
      #dismiss { display: flex; align-items: center; gap: 5px; border: 0; border-radius: 4px; padding: 6px 8px; color: #f0f0f0; background: rgba(239, 107, 107, 0.18); cursor: pointer; font: inherit; font-size: 12px; }
      #dismiss:hover { background: rgba(239, 107, 107, 0.28); }
      #dismiss svg { display: block; color: #ef6b6b; }
      #content { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
      #content img { width: 100%; height: 100%; object-fit: contain; }
      #content iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
      #content.text-mode { box-sizing: border-box; padding: 10px 10px calc(10px + 5vw); color: #fff; background: #000; font-family: Georgia, serif; font-size: max(10px, 3.5vw); line-height: 1.5; }
      #content.text-mode.light-text { color: #000; background: #fff; }
      .text-handout { max-width: 100%; max-height: 100%; overflow: auto; text-align: center; overflow-wrap: anywhere; }
      .text-handout h1, .text-handout h2, .text-handout h3, .text-handout h4 { margin: 0; line-height: inherit; }
      .text-handout h1 { font-size: 1.5em; }
      .text-handout h2 { font-size: 1.3em; }
      .text-handout h3 { font-size: 1.1em; }
      .text-handout h4 { font-size: 1em; }
      .text-handout p, .text-handout ul, .text-handout ol { margin: .4em 0; }
      .text-handout ul, .text-handout ol { padding-left: 1.5em; text-align: left; }
      #url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #aaa; font-size: 11px; }
    </style>
  </head>
  <body>
    <header><span id="title">Handout</span><button id="dismiss" type="button" title="Stop showing this handout to all players" aria-label="Stop showing this handout to all players">Dismiss <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button></header>
    <div id="content"></div>
    <div id="url"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
