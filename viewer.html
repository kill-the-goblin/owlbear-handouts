<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Handout</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
      }
      #content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #content img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #content iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      #content.dismissable {
        cursor: pointer;
      }
      #close-button {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        padding: 8px 14px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #6b6b6b;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #close-button:hover {
        background: #565656;
      }
      #error-message {
        max-width: 480px;
        margin: 0 24px;
        padding: 16px 20px;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: #fff;
        background: #7a2323;
        border-radius: 8px;
        text-align: center;
      }
      #iframe-note {
        position: fixed;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-size: 11px;
        color: #ffffff99;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="content"></div>
    <button id="close-button" type="button" hidden>Close</button>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
