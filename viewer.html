<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Handout</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
      }
      #content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #content img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #content iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      #content.text-mode {
        box-sizing: border-box;
        padding: 5vh 6vw calc(5vh + 60px);
        color: #fff;
        background: #000;
        font: 40px/1.5 Georgia, serif;
      }
      #content.text-mode.light-text { color: #000; background: #fff; }
      .text-handout { max-width: 72ch; max-height: 100%; overflow: auto; text-align: center; overflow-wrap: anywhere; }
      .text-handout h1, .text-handout h2, .text-handout h3, .text-handout h4 { margin: 0; line-height: inherit; }
      .text-handout h1 { font-size: 1.5em; }
      .text-handout h2 { font-size: 1.3em; }
      .text-handout h3 { font-size: 1.1em; }
      .text-handout h4 { font-size: 1em; }
      .text-handout p, .text-handout ul, .text-handout ol { margin: .4em 0; }
      .text-handout ul, .text-handout ol { padding-left: 1.5em; text-align: left; }
      #content.dismissable {
        cursor: pointer;
      }
      #close-button {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        padding: 8px 14px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #6b6b6b;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #close-button:hover {
        background: #565656;
      }
      #error-message {
        max-width: 480px;
        margin: 0 24px;
        padding: 16px 20px;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: #fff;
        background: #7a2323;
        border-radius: 8px;
        text-align: center;
      }
      #iframe-note {
        position: fixed;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-size: 11px;
        color: #ffffff99;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="content"></div>
    <button id="close-button" type="button" hidden>Close</button>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
