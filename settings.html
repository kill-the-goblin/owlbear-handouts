<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Handouts</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #f0f0f0;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #header {
        flex-shrink: 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 18px 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      }
      #header-title {
        font-weight: 600;
        font-size: 19px;
      }
      #header-name { display: flex; align-items: baseline; gap: 7px; }
      #header-version { color: #999; font-size: 11px; }
      #header-count {
        flex-shrink: 0;
        color: #aaa;
        font-size: 14px;
      }
      #empty {
        padding: 16px 12px;
        color: #aaa;
      }
      #list {
        list-style: none;
        margin: 0;
        padding: 4px 0;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        font-size: 17px;
      }
      #list li {
        padding: 8px 12px;
        cursor: pointer;
      }
      #list li:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      #list li + li {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .row-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .row-name {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-actions {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .link-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .link-row:last-child {
        margin-bottom: 0;
      }
      .link-number {
        flex-shrink: 0;
        width: 16px;
        color: #aaa;
        text-align: right;
      }
      .link-type {
        flex-shrink: 0;
        width: 70px;
        box-sizing: border-box;
        padding: 3px;
        color: #f0f0f0;
        background: #343434;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
      }
      .link-url {
        flex-grow: 1;
        min-width: 0;
        color: #ddd;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 3px 5px;
        font-family: inherit;
      }
      .asset-picker {
        flex-grow: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
        color: #ddd;
        font: inherit;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 3px 5px;
        cursor: pointer;
      }
      .asset-picker.is-placeholder { font-style: italic; }
      .link-url::placeholder { font-style: italic; }
      .asset-picker:hover { border-color: rgba(255, 255, 255, 0.2); }
      .link-url:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }
      .link-url:focus {
        outline: none;
        border-color: #8b9dc3;
        background: rgba(255, 255, 255, 0.1);
      }
      .link-type:focus { outline: none; border-color: #8b9dc3; }
      .remove-link {
        flex-shrink: 0;
        width: 20px;
        height: 24px;
        padding: 0;
        color: #ef6b6b;
        background: transparent;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        font-size: 17px;
      }
      .remove-link:hover { background: rgba(239, 107, 107, 0.14); }
      .link-action {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        color: #f0f0f0;
        background: transparent;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .link-action:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .link-action.add-action { font-size: 20px; line-height: 1; }
      .link-action:disabled {
        color: #666;
        cursor: default;
      }
      .link-action:disabled:hover {
        background: transparent;
      }
      #preview-settings {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 13px;
      }
      .preview-control { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      #preview-settings[hidden] { display: none; }
      #preview-location {
        box-sizing: border-box;
        width: 116px;
        padding: 4px 5px;
        color: #f0f0f0;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font: inherit;
      }
      #preview-location:focus { outline: none; border-color: #8b9dc3; }
      #preview-size {
        box-sizing: border-box;
        width: 68px;
        padding: 4px 5px;
        color: #f0f0f0;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font: inherit;
        text-align: right;
      }
      #preview-size:focus { outline: none; border-color: #8b9dc3; }
      #preview-unit { color: #aaa; }
    </style>
  </head>
  <body>
    <div id="header">
      <span id="header-name"><span id="header-title">Handouts</span><span id="header-version"></span></span>
      <span id="header-count"></span>
    </div>
    <div id="empty" hidden>No tokens have a handout link set yet.</div>
    <ul id="list"></ul>
    <div id="preview-settings">
      <div class="preview-control">
        <label for="preview-location">Preview Location</label>
        <select id="preview-location">
          <option value="bottom-left">Bottom Left</option>
          <option value="bottom-right">Bottom Right</option>
          <option value="top-left">Top Left</option>
          <option value="top-right">Top Right</option>
        </select>
      </div>
      <div class="preview-control">
        <label for="preview-size">Preview Height</label>
        <input id="preview-size" type="number" min="200" max="450" step="1" value="300" aria-label="Preview height in pixels" />
        <span id="preview-unit">px</span>
      </div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
